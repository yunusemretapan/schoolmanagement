# scripts/check.conf — the steps behind ./scripts/check (docs/testing.md).
# GREENFIELD: no code yet (rule 1: no spec, no code). The planned steps below are commented out;
# the walking skeleton spec activates them, then runs ./scripts/residue (fast + full).
# Test policy: unit tests only (ADR 0003) — every step is fast, so all carry [fast].
#
# Machine prerequisites (this machine at bootstrap: OpenJDK 25, Maven 3.9, Node 26):
# requires backend-build: java -version 2>&1 | grep -q 'version "25'
# requires web-test: node -e "process.exit(+process.versions.node.split('.')[0] >= 22 ? 0 : 1)"
#
# Backend (Maven wrapper; Maven leaves no daemon running — no switch needed; batch mode, no colour):
# backend-build [fast]: ./mvnw -B -q -f backend/pom.xml -DskipTests compile
# backend-format [fast]: ./mvnw -B -q -f backend/pom.xml spotless:check
# resource hygiene: surefire forks one JVM per module and exits; forkCount=1, reuseForks=true
# backend-test [fast]: ./mvnw -B -f backend/pom.xml test -DforkCount=1
#
# Frontend (npm workspaces; no watch mode — vitest run / jest --ci exit when done):
# frontend-install [fast]: npm ci --prefix frontend --no-audit --no-fund
# frontend-lint [fast]: npm run --prefix frontend lint
# frontend-typecheck [fast]: npm run --prefix frontend typecheck
# resource hygiene: vitest run (not watch), single run, no browser
# web-test [fast]: npm run --prefix frontend -w apps/web test -- --run
# resource hygiene: jest --ci, no watchman, workers bounded
# mobile-test [fast]: npm run --prefix frontend -w apps/mobile test -- --ci --watchman=false --maxWorkers=2
