# scripts/check.conf — the steps behind ./scripts/check (docs/testing.md). Activated by spec 0001.
# Test policy: unit tests only (ADR 0003). Every step but the dependency install is [fast];
# fast assumes frontend/node_modules is installed, full installs it from the lockfile first.
#
# Machine prerequisites (exit 0 = met; docs/testing.md, Two speeds, rule 9):
requires backend-build: java -version 2>&1 | grep -q 'version "25'
requires frontend-install: node -e "process.exit(+process.versions.node.split('.')[0] >= 26 ? 0 : 1)"
requires frontend-lint: node -e "process.exit(+process.versions.node.split('.')[0] >= 26 ? 0 : 1)"
#
# --- Backend (Maven wrapper) ---
# resource hygiene: Maven runs in-process and leaves no daemon; surefire's single fork JVM exits with the run.
# backend-build also runs the domain module's enforcer rule (Forbidden dependencies 1) and Error Prone.
backend-build [fast]: cd backend && ./mvnw -B -q -DskipTests compile
backend-format [fast]: cd backend && ./mvnw -B -q spotless:check
backend-test [fast]: cd backend && ./mvnw -B test
#
# --- Frontend (npm workspaces) ---
# resource hygiene: npm ci starts no service; full-only because a clean install can exceed a minute.
frontend-install: cd frontend && npm ci --no-audit --no-fund
frontend-contract [fast]: cd frontend && npm run contract:check -w @schoolos/api-client
frontend-format [fast]: cd frontend && npm run format:check
frontend-lint [fast]: cd frontend && npm run lint
frontend-typecheck [fast]: cd frontend && npm run typecheck
# Spec 0002 AC-7: no colour, size or duration by value in app sources (unit-tested, no dependencies).
# resource hygiene: plain node, exits when done.
frontend-design-lint [fast]: cd frontend && npm run design-lint
# Selector, not a list: every workspace with a test script runs (docs/testing.md, Two speeds, rule 4).
# resource hygiene: vitest run (no watch); mobile's script is jest --ci --watchman=false --maxWorkers=2 (no watcher, bounded workers).
frontend-test [fast]: cd frontend && npm test --workspaces --if-present
