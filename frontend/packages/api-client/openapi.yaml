openapi: 3.1.0
info:
  title: SchoolOS API
  version: 0.1.0
  description: >-
    Contract-first API description. Hand-written until the backend generates it (backlog B-4);
    every change here regenerates src/schema.ts (npm run generate).
paths:
  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      summary: Public status probe (spec 0001, AC-1). No authentication.
      responses:
        '200':
          description: The system is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusResponse'
        default:
          description: Any error, as RFC 9457 ProblemDetails.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Sign in with e-mail or phone and password (spec 0003). Public.
      description: >-
        WEB clients get the refresh token only as an HttpOnly cookie (sos_refresh); MOBILE clients get it in the body.
        Unknown identifier, wrong password and locked account all answer 401 IDENTITY_INVALID_CREDENTIALS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        default:
          description: 400 VALIDATION_FAILED, 401 IDENTITY_INVALID_CREDENTIALS, 429 IDENTITY_RATE_LIMITED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: Rotate the refresh token and get a new access token (spec 0003). Public.
      description: MOBILE sends the refresh token in the body; WEB sends nothing and the browser sends the cookie.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        default:
          description: 401 IDENTITY_SESSION_EXPIRED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: End this device's session (spec 0003). Public, so it works after the access token expired.
      description: >-
        The session is found from the bearer token when valid, otherwise from the refresh token (MOBILE body, WEB
        cookie). Always 204; the WEB cookie is cleared.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Signed out.
        default:
          description: Any error, as RFC 9457 ProblemDetails.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/me:
    get:
      operationId: getMe
      summary: The signed-in user's own account (spec 0003). Bearer token required.
      security:
        - bearer: []
      responses:
        '200':
          description: Name, institution and roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        default:
          description: 401 AUTH_UNAUTHENTICATED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/staff:
    get:
      operationId: listStaff
      summary: The institution's staff, searched and paged (spec 0004). Administrators only.
      security:
        - bearer: []
      parameters:
        - name: q
          in: query
          required: false
          description: Part of a name, e-mail or phone number (any spelling).
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: Counts from 0; 50 per page.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A page of staff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffPage'
        default:
          description: 400 VALIDATION_FAILED, 401 AUTH_UNAUTHENTICATED, 403 AUTH_FORBIDDEN.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      operationId: inviteStaff
      summary: Invite a staff member; returns the one-time link's token (spec 0004).
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffBody'
      responses:
        '201':
          description: Invited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationLink'
        default:
          description: 400 VALIDATION_FAILED, 401, 403, 422 IDENTITY_IDENTIFIER_TAKEN (wherever it is used).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/staff/{staffId}:
    get:
      operationId: getStaff
      summary: One staff member (spec 0004). Another institution's id answers like an unknown one.
      security:
        - bearer: []
      parameters:
        - name: staffId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The staff member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
        default:
          description: 401 AUTH_UNAUTHENTICATED, 403 AUTH_FORBIDDEN (not an administrator), 404 NOT_FOUND.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      operationId: updateStaff
      summary: Name and staff roles; e-mail and phone only while invited (spec 0004). A Veli role is kept.
      security:
        - bearer: []
      parameters:
        - name: staffId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffBody'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
        default:
          description: 400 VALIDATION_FAILED, 401, 403, 404, 422 IDENTITY_IDENTIFIER_TAKEN | IDENTITY_IDENTIFIER_LOCKED | IDENTITY_LAST_ADMIN | IDENTITY_SELF_CHANGE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/staff/{staffId}/invitation:
    post:
      operationId: renewInvitation
      summary: A new 72-hour link for an invited account; the old one stops working.
      security:
        - bearer: []
      parameters:
        - name: staffId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: New link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationLink'
        default:
          description: 401, 403, 404, 422 IDENTITY_STAFF_STATE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/staff/{staffId}/deactivation:
    post:
      operationId: deactivateStaff
      summary: 'Deactivate: every session ends at once, the account stays (spec 0004).'
      security:
        - bearer: []
      parameters:
        - name: staffId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
        default:
          description: 401, 403, 404, 422 IDENTITY_SELF_CHANGE | IDENTITY_LAST_ADMIN | IDENTITY_STAFF_STATE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/staff/{staffId}/reactivation:
    post:
      operationId: reactivateStaff
      summary: 'Reactivate: active with the old password, or invited again (spec 0004).'
      security:
        - bearer: []
      parameters:
        - name: staffId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
        default:
          description: 401, 403, 404, 422 IDENTITY_STAFF_STATE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/invitations/lookup:
    post:
      operationId: getInvitation
      summary: 'Whom a link invites (spec 0004). Public: the token is the credential.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationLookupRequest'
      responses:
        '200':
          description: Name and institution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationInfo'
        default:
          description: '400 VALIDATION_FAILED, 404 NOT_FOUND (invalid, expired, used or revoked: one answer), 429 IDENTITY_RATE_LIMITED.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Set the password from a link (spec 0004). Public; no automatic sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptRequest'
      responses:
        '200':
          description: The identifier to sign in with.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedInvitation'
        default:
          description: 400 VALIDATION_FAILED (password PASSWORD_TOO_SHORT), 404 NOT_FOUND, 429 IDENTITY_RATE_LIMITED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/academic-structure:
    get:
      operationId: getAcademicStructure
      summary: 'Terms (newest first), campuses, grade levels in order and the active term (spec 0005).'
      security:
        - bearer: []
      responses:
        '200':
          description: The structure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicStructure'
        default:
          description: 401 AUTH_UNAUTHENTICATED, 403 AUTH_FORBIDDEN (not an administrator).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/academic-structure/campuses:
    post:
      operationId: createCampus
      summary: 'Add a campus; the name is unique in the institution (spec 0005, Req. 3).'
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameBody'
      responses:
        '201':
          description: The structure after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicStructure'
        default:
          description: 400 VALIDATION_FAILED, 401, 403, 422 ACADEMIC_NAME_TAKEN.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/academic-structure/campuses/{campusId}:
    put:
      operationId: renameCampus
      summary: "Rename a campus. Another institution's id answers like an unknown one."
      security:
        - bearer: []
      parameters:
        - name: campusId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameBody'
      responses:
        '200':
          description: The structure after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicStructure'
        default:
          description: 400 VALIDATION_FAILED, 401, 403, 404 NOT_FOUND, 422 ACADEMIC_NAME_TAKEN.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      operationId: deleteCampus
      summary: 'Delete an unused campus; the last one stays (spec 0005, Req. 9).'
      security:
        - bearer: []
      parameters:
        - name: campusId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The structure after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicStructure'
        default:
          description: 401, 403, 404 NOT_FOUND, 422 ACADEMIC_LAST_CAMPUS | ACADEMIC_IN_USE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/academic-structure/terms:
    post:
      operationId: createTerm
      summary: 'Add a term; no day shared with another term; the first one becomes active (Req. 4).'
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TermBody'
      responses:
        '201':
          description: The structure after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicStructure'
        default:
          description: 400 VALIDATION_FAILED (endsOn END_NOT_AFTER_START | TOO_LONG, OUT_OF_RANGE), 401, 403, 422 ACADEMIC_NAME_TAKEN | ACADEMIC_TERM_OVERLAP.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/academic-structure/terms/{termId}:
    put:
      operationId: updateTerm
      summary: "Change a term's name and dates, without overlapping another term."
      security:
        - bearer: []
      parameters:
        - name: termId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TermBody'
      responses:
        '200':
          description: The structure after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicStructure'
        default:
          description: 400 VALIDATION_FAILED, 401, 403, 404 NOT_FOUND, 422 ACADEMIC_NAME_TAKEN | ACADEMIC_TERM_OVERLAP.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      operationId: deleteTerm
      summary: 'Delete an unused term that is not the active one (Req. 9).'
      security:
        - bearer: []
      parameters:
        - name: termId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The structure after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicStructure'
        default:
          description: 401, 403, 404 NOT_FOUND, 422 ACADEMIC_ACTIVE_TERM | ACADEMIC_IN_USE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/academic-structure/terms/{termId}/activation:
    post:
      operationId: activateTerm
      summary: 'Make this the active term; the previous one stops being active.'
      security:
        - bearer: []
      parameters:
        - name: termId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The structure after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicStructure'
        default:
          description: 401, 403, 404 NOT_FOUND.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/academic-structure/grade-levels:
    post:
      operationId: createGradeLevel
      summary: 'Add a grade level at the end; at most 50 (Req. 5).'
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameBody'
      responses:
        '201':
          description: The structure after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicStructure'
        default:
          description: 400 VALIDATION_FAILED, 401, 403, 422 ACADEMIC_NAME_TAKEN | ACADEMIC_GRADE_LEVEL_LIMIT.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/academic-structure/grade-levels/standard:
    post:
      operationId: addStandardGradeLevels
      summary: 'Anaokulu, 1.-12. sınıf, Hazırlık: only while there are no grade levels.'
      security:
        - bearer: []
      responses:
        '201':
          description: The structure after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicStructure'
        default:
          description: 401, 403, 422 ACADEMIC_GRADE_LEVELS_NOT_EMPTY.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/academic-structure/grade-levels/{gradeLevelId}:
    put:
      operationId: renameGradeLevel
      summary: 'Rename a grade level.'
      security:
        - bearer: []
      parameters:
        - name: gradeLevelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameBody'
      responses:
        '200':
          description: The structure after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicStructure'
        default:
          description: 400 VALIDATION_FAILED, 401, 403, 404 NOT_FOUND, 422 ACADEMIC_NAME_TAKEN.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      operationId: deleteGradeLevel
      summary: 'Delete an unused grade level; the ones after it move up.'
      security:
        - bearer: []
      parameters:
        - name: gradeLevelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The structure after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicStructure'
        default:
          description: 401, 403, 404 NOT_FOUND, 422 ACADEMIC_IN_USE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/academic-structure/grade-levels/{gradeLevelId}/move:
    post:
      operationId: moveGradeLevel
      summary: 'Swap with the neighbour above or below; the ends cannot move further.'
      security:
        - bearer: []
      parameters:
        - name: gradeLevelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveBody'
      responses:
        '200':
          description: The structure after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicStructure'
        default:
          description: 401, 403, 404 NOT_FOUND, 422 ACADEMIC_CANNOT_MOVE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/academic-structure/class-groups:
    get:
      operationId: listClassGroups
      summary: 'Class groups of a term (default: the active term), by grade level order then name.'
      security:
        - bearer: []
      parameters:
        - name: termId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: campusId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The class groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassGroupList'
        default:
          description: 401, 403, 404 NOT_FOUND (unknown term or campus).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      operationId: createClassGroup
      summary: 'Add a class group; the only campus and the active term are the defaults (Req. 6).'
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassGroupBody'
      responses:
        '201':
          description: The class group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassGroupView'
        default:
          description: 400 VALIDATION_FAILED (campusId NOT_NULL with several campuses), 401, 403, 404 NOT_FOUND, 422 ACADEMIC_NAME_TAKEN | ACADEMIC_NO_TERM.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/academic-structure/class-groups/{classGroupId}:
    put:
      operationId: updateClassGroup
      summary: "Change a class group's name and grade level; its campus and term never change."
      security:
        - bearer: []
      parameters:
        - name: classGroupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassGroupBody'
      responses:
        '200':
          description: The class group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassGroupView'
        default:
          description: 400 VALIDATION_FAILED, 401, 403, 404 NOT_FOUND, 422 ACADEMIC_NAME_TAKEN.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      operationId: deleteClassGroup
      summary: 'Delete a class group.'
      security:
        - bearer: []
      parameters:
        - name: classGroupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted.
        default:
          description: 401, 403, 404 NOT_FOUND.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password, clientType]
      properties:
        identifier:
          type: string
          description: E-mail or Turkish mobile number.
        password:
          type: string
        clientType:
          $ref: '#/components/schemas/ClientType'
    ClientType:
      type: string
      enum: [WEB, MOBILE]
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
    TokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, expiresInSeconds]
      properties:
        accessToken:
          type: string
        expiresInSeconds:
          type: integer
        refreshToken:
          type: string
          description: MOBILE only.
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [userId, fullName, institutionName, roles]
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        institutionName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    Role:
      type: string
      enum: [ADMIN, TEACHER, GUARDIAN, ACCOUNTANT]
    AccountStatus:
      type: string
      enum: [INVITED, ACTIVE, INACTIVE]
    StaffBody:
      type: object
      additionalProperties: false
      required: [fullName, roles]
      properties:
        fullName:
          type: string
        email:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        roles:
          type: array
          description: Staff roles only (ADMIN, TEACHER, ACCOUNTANT); GUARDIAN is refused.
          items:
            $ref: '#/components/schemas/Role'
    StaffSummary:
      type: object
      additionalProperties: false
      required: [id, fullName, email, phone, roles, status]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/AccountStatus'
    StaffPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffSummary'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    StaffDetail:
      type: object
      additionalProperties: false
      required: [id, fullName, email, phone, roles, status, invitationExpiresAt, self, lastActiveAdmin]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/AccountStatus'
        invitationExpiresAt:
          type: [string, 'null']
          format: date-time
          description: Set while a usable invitation link exists.
        self:
          type: boolean
          description: The caller's own account.
        lastActiveAdmin:
          type: boolean
          description: The institution's only active administrator.
    InvitationLink:
      type: object
      additionalProperties: false
      required: [staffId, token, expiresAt]
      properties:
        staffId:
          type: string
          format: uuid
        token:
          type: string
          description: The web app builds <origin>/davet#<token>; shown once, never stored by the server.
        expiresAt:
          type: string
          format: date-time
    InvitationLookupRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
    InvitationAcceptRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
    InvitationInfo:
      type: object
      additionalProperties: false
      required: [fullName, institutionName]
      properties:
        fullName:
          type: string
        institutionName:
          type: string
    AcceptedInvitation:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier:
          type: string
    NameBody:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          description: Trimmed; at most 60 characters.
    TermBody:
      type: object
      additionalProperties: false
      required: [name, startsOn, endsOn]
      properties:
        name:
          type: string
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
    MoveBody:
      type: object
      additionalProperties: false
      required: [direction]
      properties:
        direction:
          type: string
          enum: [UP, DOWN]
    ClassGroupBody:
      type: object
      additionalProperties: false
      required: [name, gradeLevelId]
      properties:
        name:
          type: string
          description: Trimmed; at most 20 characters.
        gradeLevelId:
          type: string
          format: uuid
        campusId:
          type: [string, 'null']
          format: uuid
          description: Creation only; may be left out while the institution has one campus.
        termId:
          type: [string, 'null']
          format: uuid
          description: Creation only; defaults to the active term.
    AcademicStructure:
      type: object
      additionalProperties: false
      required: [activeTermId, terms, campuses, gradeLevels]
      properties:
        activeTermId:
          type: [string, 'null']
          format: uuid
        terms:
          type: array
          items:
            $ref: '#/components/schemas/TermView'
        campuses:
          type: array
          items:
            $ref: '#/components/schemas/CampusView'
        gradeLevels:
          type: array
          items:
            $ref: '#/components/schemas/GradeLevelView'
    TermView:
      type: object
      additionalProperties: false
      required: [id, name, startsOn, endsOn, active, inUse]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        active:
          type: boolean
        inUse:
          type: boolean
          description: Class groups belong to it, so it cannot be deleted.
    CampusView:
      type: object
      additionalProperties: false
      required: [id, name, inUse]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        inUse:
          type: boolean
    GradeLevelView:
      type: object
      additionalProperties: false
      required: [id, name, position, inUse]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
        inUse:
          type: boolean
    ClassGroupView:
      type: object
      additionalProperties: false
      required: [id, name, campusId, termId, gradeLevelId]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        campusId:
          type: string
          format: uuid
        termId:
          type: string
          format: uuid
        gradeLevelId:
          type: string
          format: uuid
    ClassGroupList:
      type: object
      additionalProperties: false
      required: [termId, items]
      properties:
        termId:
          type: [string, 'null']
          format: uuid
          description: null while the institution has no term.
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClassGroupView'
    SystemStatusResponse:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [UP]
        version:
          type: string
          examples: ['0.1.0']
    ProblemDetails:
      type: object
      required: [status, title, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        instance:
          type: string
        code:
          type: string
          description: Stable error code, e.g. NOT_FOUND (docs/conventions.md, Error handling).
        errors:
          type: object
          additionalProperties:
            type: string
          description: VALIDATION_FAILED only — field → error code.
